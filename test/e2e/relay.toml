[info]
relay_url = "ws://localhost:7777/"
name = "bouquet-e2e"
description = "Ephemeral relay for bouquet integration tests"

[database]
# Nothing survives the container, which is the point.
in_memory = true

[network]
address = "0.0.0.0"
port = 8080

[options]
reject_future_seconds = 1800

[limits]
# A test uploads a burst of events; rate limiting would only add flake.
messages_per_sec = 0
subscriptions_per_min = 0
limit_scrapers = false
