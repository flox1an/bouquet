# Push auf main: Image bauen, in die Forgejo-Registry pushen, Coolify deployen.
# Laeuft auf dem Forgejo-Runner (CT 112, tag:runner) -- siehe home-network, Ticket 040.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGISTRY: forgejo.tail238b01.ts.net
      IMAGE: forgejo.tail238b01.ts.net/${{ github.repository }}
      COOLIFY_UUID: yt3qxsjx9f6u4v61ibmyyqtq
    steps:
      - uses: actions/checkout@v4

      - name: Build und Push
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.repository_owner }}" --password-stdin
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}" \
            "http://coolify.tail238b01.ts.net:8000/api/v1/deploy?uuid=$COOLIFY_UUID"
