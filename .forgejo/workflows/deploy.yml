# Push auf main: Image bauen, in die Forgejo-Registry pushen, Coolify deployen.
# Laeuft auf dem Forgejo-Runner. Hostnamen kommen aus Forgejo (Server-URL, User-Variable
# COOLIFY_TAILNET_HOST), weil dieses Repo auf GitHub oeffentlich ist.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      COOLIFY_TAILNET_HOST: ${{ vars.COOLIFY_TAILNET_HOST }}
      COOLIFY_UUID: yt3qxsjx9f6u4v61ibmyyqtq
    steps:
      - uses: actions/checkout@v4

      - name: Build und Push
        run: |
          REGISTRY="${GITHUB_SERVER_URL#https://}"
          IMAGE="$REGISTRY/${{ github.repository }}"
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.repository_owner }}" --password-stdin
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}" \
            "http://${COOLIFY_TAILNET_HOST}:8000/api/v1/deploy?uuid=$COOLIFY_UUID"
